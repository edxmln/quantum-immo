
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Immo — Scanner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0a0a0f;color:#e0e0e0;font-family:'IBM Plex Mono',monospace;overflow:hidden;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:#222;border-radius:2px;}
#app{display:flex;flex-direction:column;height:100vh;}
#nav{background:#0d0d15;border-bottom:1px solid #1a1a28;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.logo{font-size:13px;font-weight:700;letter-spacing:.25em;color:#00ff87;}
.logo-sub{font-size:8px;color:#2a2a2a;letter-spacing:.2em;margin-top:2px;}
.tabs{display:flex;}
.tb{background:transparent;border:none;border-bottom:2px solid transparent;color:#444;padding:8px 14px;cursor:pointer;font-size:9px;letter-spacing:.15em;text-transform:uppercase;font-family:inherit;}
.tb.on{border-bottom-color:#00ff87;color:#00ff87;}
#scanner{display:flex;flex:1;overflow:hidden;}
#left{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid #1a1a28;background:#0d0d15;}
#search{padding:14px;border-bottom:1px solid #1a1a28;flex-shrink:0;}
.lbl{font-size:8px;color:#444;letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:5px;}
select,input{background:#111118;border:1px solid #1e1e2e;border-radius:4px;padding:8px 10px;color:#e0e0e0;font-size:12px;font-family:inherit;width:100%;}
select:focus,input:focus{outline:none;border-color:#00ff8755;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.scan-btn{width:100%;margin-top:10px;background:linear-gradient(135deg,#00ff87,#00c8ff);border:none;border-radius:4px;padding:11px;color:#000;font-size:11px;font-family:inherit;font-weight:700;letter-spacing:.15em;cursor:pointer;}
.scan-btn:disabled{opacity:.4;cursor:not-allowed;}
.scan-btn:hover:not(:disabled){opacity:.85;}
#log{padding:8px 14px;border-bottom:1px solid #1a1a28;font-size:9px;color:#555;letter-spacing:.1em;flex-shrink:0;min-height:28px;}
.l-ok{color:#00ff87;}.l-err{color:#ff4444;}.l-info{color:#00c8ff;}
#blist{flex:1;overflow-y:auto;padding:8px;}
.bcard{background:#111118;border:1px solid #1e1e2e;border-radius:5px;padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:border-color .15s;}
.bcard:hover,.bcard.sel{border-color:#00ff8744;background:#0d150d;}
.baddr{font-size:11px;font-weight:500;color:#ddd;margin-bottom:3px;}
.bmeta{font-size:9px;color:#444;margin-bottom:6px;}
.bscore{display:flex;align-items:center;gap:8px;}
.bar{flex:1;height:3px;background:#1a1a28;border-radius:2px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;}
.sval{font-size:9px;font-weight:700;min-width:28px;text-align:right;}
.chip{font-size:8px;padding:2px 6px;border-radius:3px;font-weight:700;}
#map-wrap{flex:1;position:relative;}
#map{width:100%;height:100%;}
#right{width:360px;flex-shrink:0;border-left:1px solid #1a1a28;background:#0d0d15;overflow-y:auto;}
#rpanel{padding:14px;}
.empty-state{text-align:center;padding:50px 20px;color:#333;}
.empty-icon{font-size:32px;margin-bottom:10px;}
.empty-t{font-size:13px;color:#3a3a3a;margin-bottom:5px;}
.empty-s{font-size:10px;color:#2a2a2a;}
.pt{font-size:8px;letter-spacing:.25em;color:#333;text-transform:uppercase;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #141420;}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.met{background:#111118;border:1px solid #1e1e2e;border-radius:4px;padding:10px;}
.mlbl{font-size:8px;color:#3a3a3a;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.mval{font-size:15px;font-weight:700;color:#00ff87;}
.links{display:flex;gap:7px;margin-bottom:12px;}
.lbtn{flex:1;background:#111118;border:1px solid #1e1e2e;border-radius:4px;padding:8px;text-align:center;color:#00c8ff;font-size:9px;text-decoration:none;letter-spacing:.1em;display:block;}
.lbtn.gold{color:#ffb400;}
.jbox{background:#111118;border:1px solid #1e1e2e;border-radius:5px;padding:12px;margin-bottom:10px;}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
.fg label{font-size:8px;color:#444;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px;}
.abtn{width:100%;border:none;border-radius:4px;padding:10px;font-size:10px;font-family:inherit;font-weight:700;letter-spacing:.12em;cursor:pointer;margin-bottom:7px;}
.abtn-p{background:linear-gradient(135deg,#00ff87,#00c8ff);color:#000;}
.abtn-s{background:transparent;border:1px solid #1e1e2e;color:#555;}
.abtn:hover:not(:disabled){opacity:.85;}
.abtn:disabled{opacity:.35;cursor:not-allowed;}
.ares{border-top:1px solid #1e1e2e;padding-top:12px;margin-top:4px;}
.atitle{font-size:8px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;}
.atext{font-size:10px;color:#666;line-height:1.8;}
.aitem{font-size:10px;color:#666;line-height:1.8;}
.lettre{background:#111118;border:1px solid #1e1e2e;border-radius:4px;padding:12px;font-size:10px;line-height:1.9;color:#777;white-space:pre-wrap;margin-bottom:8px;}
.cbtn{background:transparent;border:1px solid #1e1e2e;color:#555;border-radius:3px;padding:5px 10px;font-size:9px;cursor:pointer;font-family:inherit;margin-right:6px;}
.sbtn{background:transparent;border:1px solid #00ff8733;color:#00ff87;border-radius:3px;padding:5px 10px;font-size:9px;cursor:pointer;font-family:inherit;}
.cbtn:hover{color:#ddd;}.sbtn:hover{background:#00ff8710;}
.vbuy{background:rgba(0,255,135,.08);border:1px solid rgba(0,255,135,.2);color:#00ff87;padding:4px 10px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.15em;display:inline-block;}
.vwatch{background:rgba(255,180,0,.08);border:1px solid rgba(255,180,0,.2);color:#ffb400;padding:4px 10px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.15em;display:inline-block;}
.vpass{background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);color:#ff4444;padding:4px 10px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.15em;display:inline-block;}
#prospects{display:none;overflow-y:auto;flex:1;padding:20px;max-width:900px;margin:0 auto;width:100%;}
.pc{background:#0d0d15;border:1px solid #1a1a28;border-radius:7px;padding:14px;margin-bottom:10px;}
.pc-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;}
.pc-a{font-size:13px;font-weight:500;color:#ddd;}
.pc-m{font-size:9px;color:#444;margin-top:2px;}
.delbtn{background:transparent;border:none;color:#222;cursor:pointer;font-size:13px;}
.delbtn:hover{color:#ff4444;}
details summary{font-size:10px;color:#444;cursor:pointer;padding:4px 0;user-select:none;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #1e1e2e;border-top:2px solid #00ff87;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg)}}
.sv-frame{width:100%;height:160px;border:none;border-radius:4px;margin-bottom:10px;display:block;}
</style>
</head>
<body>
<div id="app">
  <div id="nav">
    <div>
      <div class="logo">◈ QUANTUM IMMO</div>
      <div class="logo-sub">SCANNER OFF-MARKET · QUÉBEC</div>
    </div>
    <div class="tabs">
      <button class="tb on" onclick="goTab('scanner')">Scanner</button>
      <button class="tb" onclick="goTab('prospects')">Prospects <span id="pcnt"></span></button>
    </div>
  </div>

  <div id="scanner">
    <div id="left">
      <div id="search">
        <label class="lbl">Ville</label>
        <select id="city-sel" onchange="onCity()">
          <option value="granby">Granby</option>
          <option value="sherbrooke">Sherbrooke</option>
          <option value="montreal">Montréal</option>
          <option value="laval">Laval</option>
          <option value="longueuil">Longueuil</option>
          <option value="brossard">Brossard</option>
          <option value="sjsr">Saint-Jean-sur-Richelieu</option>
          <option value="drummondville">Drummondville</option>
          <option value="troisrivieres">Trois-Rivières</option>
          <option value="stHyacinthe">Saint-Hyacinthe</option>
          <option value="victoriaville">Victoriaville</option>
          <option value="rimouski">Rimouski</option>
          <option value="quebec">Québec (ville)</option>
        </select>
        <div class="row2">
          <div><label class="lbl" style="margin-top:8px">Rayon</label>
            <select id="radius-sel">
              <option value="800">800m</option>
              <option value="1500" selected>1.5 km</option>
              <option value="2500">2.5 km</option>
              <option value="4000">4 km</option>
            </select>
          </div>
          <div><label class="lbl" style="margin-top:8px">Min. étages</label>
            <select id="floors-sel">
              <option value="2" selected>2+</option>
              <option value="3">3+</option>
              <option value="4">4+</option>
            </select>
          </div>
        </div>
        <button class="scan-btn" id="sbtn" onclick="scan()">▶ Scanner la zone</button>
      </div>
      <div id="log">En attente du scan...</div>
      <div id="blist">
        <div class="empty-state">
          <div class="empty-icon">🗺️</div>
          <div class="empty-t">Sélectionne une ville</div>
          <div class="empty-s">et clique Scanner</div>
        </div>
      </div>
    </div>

    <div id="map-wrap"><div id="map"></div></div>

    <div id="right">
      <div id="rpanel">
        <div class="empty-state">
          <div class="empty-icon">🏢</div>
          <div class="empty-t">Clique sur un immeuble</div>
          <div class="empty-s">dans la liste ou sur la carte</div>
        </div>
      </div>
    </div>
  </div>

  <div id="prospects"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CITIES = {
  granby:        {lat:45.3986,lon:-72.7311,name:'Granby'},
  sherbrooke:    {lat:45.4042,lon:-71.8929,name:'Sherbrooke'},
  montreal:      {lat:45.5231,lon:-73.5826,name:'Montréal'},
  laval:         {lat:45.6066,lon:-73.7124,name:'Laval'},
  longueuil:     {lat:45.5312,lon:-73.5185,name:'Longueuil'},
  brossard:      {lat:45.4584,lon:-73.4706,name:'Brossard'},
  sjsr:          {lat:45.3069,lon:-73.2632,name:'Saint-Jean-sur-Richelieu'},
  drummondville: {lat:45.8836,lon:-72.4832,name:'Drummondville'},
  troisrivieres: {lat:46.3432,lon:-72.5459,name:'Trois-Rivières'},
  stHyacinthe:   {lat:45.6295,lon:-72.9597,name:'Saint-Hyacinthe'},
  victoriaville: {lat:46.0567,lon:-71.9742,name:'Victoriaville'},
  rimouski:      {lat:48.4516,lon:-68.5318,name:'Rimouski'},
  quebec:        {lat:46.8139,lon:-71.2082,name:'Québec'},
};

let map, mlayer, buildings=[], selB=null, prospects=[];

function initMap(lat,lon){
  if(!map){
    map=L.map('map',{zoomControl:true,attributionControl:false}).setView([lat,lon],14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(map);
    mlayer=L.layerGroup().addTo(map);
  } else { map.setView([lat,lon],14); }
}

function onCity(){
  const v=document.getElementById('city-sel').value;
  if(CITIES[v]) initMap(CITIES[v].lat,CITIES[v].lon);
}

function scoreB(b){
  const t=b.tags||{},l=parseInt(t['building:levels'])||0,y=parseInt(t.start_date||t['construction:date'])||0;
  let s=0;
  if(t.building==='apartments') s+=28; else if(t.building==='residential') s+=16; else if(t.building) s+=8;
  if(l>=5) s+=28; else if(l>=4) s+=22; else if(l>=3) s+=15; else if(l>=2) s+=8;
  if(y>0&&y<1975) s+=28; else if(y>0&&y<1990) s+=18; else if(y>0&&y<2005) s+=8;
  if(!t.name) s+=8; if(t['addr:housenumber']) s+=8;
  return Math.min(Math.max(s,5),100);
}
const scol=s=>s>=65?'#00ff87':s>=40?'#ffb400':'#666';
const schip=s=>s>=65
  ?`<span class="chip" style="background:rgba(0,255,135,.1);color:#00ff87;border:1px solid rgba(0,255,135,.2)">Fort</span>`
  :s>=40?`<span class="chip" style="background:rgba(255,180,0,.1);color:#ffb400;border:1px solid rgba(255,180,0,.2)">Moyen</span>`
  :`<span class="chip" style="background:rgba(80,80,80,.1);color:#555;border:1px solid #222">Faible</span>`;

function baddr(b){const t=b.tags||{};const n=t['addr:housenumber']||'',s=t['addr:street']||'';return(n&&s)?`${n} ${s}`:s||`Bâtiment #${b.id}`;}
function bmeta(b){const t=b.tags||{},p=[];if(t['building:levels'])p.push(`${t['building:levels']} étages`);if(t.start_date)p.push(t.start_date);return p.join(' · ')||t.building||'Bâtiment';}
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('fr-CA');
const fmtP=n=>n==null?'—':n.toFixed(2)+'%';

async function scan(){
  const sel=document.getElementById('city-sel').value;
  const c=CITIES[sel]; if(!c) return;
  const radius=document.getElementById('radius-sel').value;
  const minF=document.getElementById('floors-sel').value;
  document.getElementById('sbtn').disabled=true;
  log('⟳ Connexion à OpenStreetMap...','info');
  initMap(c.lat,c.lon);
  mlayer.clearLayers(); buildings=[]; renderList();

  const query=`[out:json][timeout:35];(way["building"="apartments"](around:${radius},${c.lat},${c.lon});way["building"="residential"]["building:levels"~"^[${minF}-9]$|^[1-9][0-9]$"](around:${radius},${c.lat},${c.lon});way["building:levels"~"^[${minF}-9]$|^[1-9][0-9]$"]["building"~"apartments|residential|yes"](around:${radius},${c.lat},${c.lon}););out center tags 200;`;

  try{
    log('⟳ Scan en cours — 10 à 30 secondes...','info');
    const r=await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST',
      body:'data='+encodeURIComponent(query),
      headers:{'Content-Type':'application/x-www-form-urlencoded'}
    });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    buildings=(d.elements||[]).filter(b=>b.center||(b.lat&&b.lon)).map(b=>({...b,_score:scoreB(b)})).sort((a,b)=>b._score-a._score).slice(0,150);
    if(!buildings.length){log('Aucun immeuble trouvé — essaie un rayon plus grand','err');document.getElementById('sbtn').disabled=false;return;}
    buildings.forEach((b,i)=>{
      const lat=b.center?b.center.lat:b.lat,lon=b.center?b.center.lon:b.lon;
      const col=scol(b._score);
      const icon=L.divIcon({className:'',html:`<div style="width:${b._score>=65?14:10}px;height:${b._score>=65?14:10}px;border-radius:50%;background:${col};border:2px solid rgba(0,0,0,.4);cursor:pointer;transition:transform .1s;" onmouseover="this.style.transform='scale(1.5)'" onmouseout="this.style.transform='scale(1)'"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
      const m=L.marker([lat,lon],{icon}).addTo(mlayer);
      m.on('click',()=>selectB(b));
    });
    renderList();
    const forts=buildings.filter(b=>b._score>=65).length;
    log(`✓ ${buildings.length} immeubles · ${forts} forts signaux`,'ok');
  }catch(e){
    log(`✗ Erreur: ${e.message}`,'err');
  }
  document.getElementById('sbtn').disabled=false;
}

function log(msg,type){const el=document.getElementById('log');el.textContent=msg;el.className=type==='ok'?'l-ok':type==='err'?'l-err':type==='info'?'l-info':'';}

function renderList(){
  const el=document.getElementById('blist');
  if(!buildings.length){el.innerHTML=`<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-t">Aucun résultat</div><div class="empty-s">Essaie un rayon plus grand</div></div>`;return;}
  el.innerHTML=buildings.map((b,i)=>`<div class="bcard ${selB&&selB.id===b.id?'sel':''}" onclick="selectB(buildings[${i}])"><div class="baddr">${baddr(b)}</div><div class="bmeta">${bmeta(b)}</div><div class="bscore"><div class="bar"><div class="bar-fill" style="width:${b._score}%;background:${scol(b._score)}"></div></div><span class="sval" style="color:${scol(b._score)}">${b._score}%</span>${schip(b._score)}</div></div>`).join('');
}

function selectB(b){
  selB=b; renderList();
  const lat=b.center?b.center.lat:b.lat,lon=b.center?b.center.lon:b.lon;
  if(map) map.setView([lat,lon],16);
  renderRight(b);
}

function renderRight(b){
  const addr=baddr(b),meta=bmeta(b),t=b.tags||{};
  const blat=b.center?b.center.lat:b.lat,blon=b.center?b.center.lon:b.lon;
  const gmUrl=`https://www.google.com/maps?q=${blat},${blon}&layer=c`;
  const jlrUrl=`https://www.jlr.ca/fr/recherche?q=${encodeURIComponent(addr)}`;
  const svUrl=`https://maps.googleapis.com/maps/api/streetview?size=640x160&location=${blat},${blon}&key=VOTRE_CLE_API`;

  document.getElementById('rpanel').innerHTML=`
    <div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
        <div style="flex:1;margin-right:8px;">
          <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:3px;">${addr}</div>
          <div style="font-size:9px;color:#444;">${meta}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          ${b._score>=65?'<div class="vbuy">FORT</div>':b._score>=40?'<div class="vwatch">MOYEN</div>':'<div style="font-size:9px;color:#333">FAIBLE</div>'}
          <div style="font-size:9px;color:#333;margin-top:4px;">Score <span style="color:#00ff87">${b._score}</span>/100</div>
        </div>
      </div>

      <div id="sv-container" style="background:#111118;border:1px solid #1e1e2e;border-radius:4px;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:10px;color:#333;cursor:pointer;" onclick="openSV(${blat},${blon})">
        📷 Cliquer pour Street View
      </div>

      <div class="metrics">
        <div class="met"><div class="mlbl">Étages</div><div class="mval">${t['building:levels']||'?'}</div></div>
        <div class="met"><div class="mlbl">Construction</div><div class="mval" style="font-size:12px;">${t.start_date||'?'}</div></div>
        <div class="met"><div class="mlbl">Type</div><div class="mval" style="font-size:11px;color:#00c8ff;">${t.building||'?'}</div></div>
        <div class="met"><div class="mlbl">Coords</div><div class="mval" style="font-size:9px;color:#444;">${blat.toFixed(4)}, ${blon.toFixed(4)}</div></div>
      </div>

      <div class="links">
        <a href="${gmUrl}" target="_blank" class="lbtn">📷 Street View</a>
        <a href="${jlrUrl}" target="_blank" class="lbtn gold">🔍 JLR</a>
      </div>

      <div class="jbox">
        <div class="pt">Données JLR — 2 minutes</div>
        <div class="jgrid">
          <div class="fg"><label>Prix demandé ($)</label><input type="number" id="j-price" placeholder="ex: 850000"></div>
          <div class="fg"><label>Éval. municipale ($)</label><input type="number" id="j-eval" placeholder="ex: 680000"></div>
          <div class="fg"><label>Nombre de portes</label><input type="number" id="j-doors" placeholder="ex: 6"></div>
          <div class="fg"><label>Revenu brut annuel ($)</label><input type="number" id="j-rev" placeholder="ex: 72000"></div>
          <div class="fg"><label>Nom propriétaire</label><input type="text" id="j-owner" placeholder="ex: Jean Tremblay"></div>
          <div class="fg"><label>Dernière transaction</label><input type="text" id="j-sale" placeholder="ex: 2019 · 620K$"></div>
        </div>
        <div class="fg"><label>Observations</label><input type="text" id="j-notes" placeholder="ex: 2 logements vacants, toiture à refaire..."></div>
      </div>

      <button class="abtn abtn-p" onclick="doAnalyze()">📊 Analyser le deal →</button>
      <button class="abtn abtn-s" onclick="doLettre()">✉ Générer lettre d'approche</button>
      <div id="ares"></div>
    </div>`;
}

function openSV(lat,lon){
  window.open(`https://www.google.com/maps?q=${lat},${lon}&layer=c`,'_blank');
}

async function doAnalyze(){
  if(!selB) return;
  const g=id=>document.getElementById(id)?.value||'';
  const addr=baddr(selB),t=selB.tags||{};
  const price=g('j-price'),eval_=g('j-eval'),doors=g('j-doors'),rev=g('j-rev'),owner=g('j-owner'),sale=g('j-sale'),notes=g('j-notes');
  const noi=rev?Math.round(parseFloat(rev)*0.65):null;
  document.getElementById('ares').innerHTML=`<div style="text-align:center;padding:20px;"><span class="spin"></span><span style="font-size:10px;color:#444;letter-spacing:.1em;">Analyse IA...</span></div>`;
  const prompt=`Analyste immobilier expert Québec. JSON uniquement, sans texte ni backticks.

Adresse: ${addr}
OSM: ${t['building:levels']||'?'} étages · ${t.start_date||'?'} · ${t.building||'?'}
Prix: ${price||'?'}$  Éval: ${eval_||'?'}$  Portes: ${doors||'?'}
Revenu brut: ${rev||'?'}$/an  NOI est.: ${noi||'?'}$
Dernière vente: ${sale||'?'}  Proprio: ${owner||'?'}
Notes: ${notes||'aucune'}

{"verdict":"ACHETER"|"SURVEILLER"|"PASSER","score":0-100,"prixParPorte":number|null,"tauxCap":number|null,"noi":number|null,"valeurRevenu":number|null,"ecart":number|null,"synthese":"string","forces":["",""],"risques":["",""],"optimisations":["","",""],"schl":"string","jlr":"string"}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    const txt=d.content?.map(i=>i.text||'').join('')||'';
    const res=JSON.parse(txt.replace(/```json|```/g,'').trim());
    selB._analysis=res; selB._jlr={price,eval_,doors,rev,owner,sale,notes};
    showAnalysis(res);
  }catch(e){document.getElementById('ares').innerHTML=`<div style="color:#ff6666;font-size:10px;padding:10px;">Erreur — réessaie</div>`;}
}

function showAnalysis(r){
  const vc=r.verdict==='ACHETER'?'vbuy':r.verdict==='PASSER'?'vpass':'vwatch';
  document.getElementById('ares').innerHTML=`
    <div class="ares">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="${vc}">${r.verdict}</div>
        <div style="font-size:9px;color:#333;">Score <span style="color:#00ff87">${r.score}</span>/100</div>
      </div>
      <div class="metrics">
        ${r.prixParPorte!=null?`<div class="met"><div class="mlbl">Prix/porte</div><div class="mval" style="font-size:13px;">${fmt(r.prixParPorte)}$</div></div>`:''}
        ${r.tauxCap!=null?`<div class="met"><div class="mlbl">Cap rate</div><div class="mval" style="color:${r.tauxCap>=5.5?'#00ff87':r.tauxCap>=4.5?'#ffb400':'#ff4444'}">${fmtP(r.tauxCap)}</div></div>`:''}
        ${r.noi!=null?`<div class="met"><div class="mlbl">NOI</div><div class="mval" style="color:#00c8ff;font-size:12px;">${fmt(r.noi)}$</div></div>`:''}
        ${r.ecart!=null?`<div class="met"><div class="mlbl">Écart valeur</div><div class="mval" style="color:${r.ecart>0?'#00ff87':'#ff4444'};font-size:12px;">${r.ecart>0?'+':''}${fmt(r.ecart)}$</div></div>`:''}
      </div>
      <div style="margin-bottom:10px;"><div class="atitle" style="color:#00c8ff;">Synthèse</div><div class="atext">${r.synthese}</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div><div class="atitle" style="color:#00ff87;">Forces</div>${(r.forces||[]).map(f=>`<div class="aitem"><span style="color:#00ff87">↑ </span>${f}</div>`).join('')}</div>
        <div><div class="atitle" style="color:#ff4444;">Risques</div>${(r.risques||[]).map(f=>`<div class="aitem"><span style="color:#ff4444">⚠ </span>${f}</div>`).join('')}</div>
      </div>
      <div style="margin-bottom:10px;"><div class="atitle" style="color:#ffb400;">Optimisations</div>${(r.optimisations||[]).map(o=>`<div class="aitem"><span style="color:#ffb400">→ </span>${o}</div>`).join('')}</div>
      ${r.schl?`<div style="background:#111118;border-radius:4px;padding:10px;margin-bottom:10px;"><div class="atitle" style="color:#00c8ff;">SCHL</div><div style="font-size:9px;color:#555;line-height:1.7;">${r.schl}</div></div>`:''}
      <div style="background:#111118;border-radius:4px;padding:10px;margin-bottom:10px;"><div class="atitle" style="color:#444;">JLR</div><div style="font-size:9px;color:#444;line-height:1.7;">${r.jlr}</div></div>
      <button class="abtn abtn-p" onclick="doLettre()">✉ Générer lettre →</button>
    </div>`;
}

async function doLettre(){
  if(!selB) return;
  const g=id=>document.getElementById(id)?.value||'';
  const addr=baddr(selB),t=selB.tags||{};
  const owner=g('j-owner')||selB._jlr?.owner||'';
  const doors=g('j-doors')||selB._jlr?.doors||'';
  const notes=g('j-notes')||selB._jlr?.notes||'';
  document.getElementById('ares').insertAdjacentHTML('beforeend',`<div id="lsec"><div style="text-align:center;padding:14px;"><span class="spin"></span><span style="font-size:10px;color:#444;">Génération lettre...</span></div></div>`);
  const prompt=`Investisseur immobilier professionnel québécois. UNIQUEMENT la lettre, rien d'autre.
Adresse: ${addr}  Proprio: ${owner||'?'}
Immeuble: ${t['building:levels']||'?'} étages ${doors?'· ~'+doors+' portes':''} · ${t.start_date||'?'}
Notes: ${notes||'immeuble repéré lors d\'une analyse de secteur'}
Règles: 150-200 mots · chaleureux et direct · ne pas mentionner problèmes · acheteur sérieux financement confirmé · invitation discrète · signature: Edgar · commence par "Bonjour${owner?' M./Mme '+owner.split(' ').slice(-1)[0]:''},\n\n"`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    const lettre=d.content?.map(i=>i.text||'').join('')||'';
    selB._lettre=lettre;
    document.getElementById('lsec').innerHTML=`
      <div style="border-top:1px solid #1e1e2e;padding-top:12px;margin-top:8px;">
        <div class="atitle" style="color:#00c8ff;">✉ Lettre d'approche</div>
        <div class="lettre" id="ltxt">${lettre}</div>
        <button class="cbtn" onclick="navigator.clipboard.writeText(document.getElementById('ltxt').textContent)">Copier</button>
        <button class="sbtn" onclick="saveP()">Sauvegarder prospect</button>
      </div>`;
  }catch(e){document.getElementById('lsec').innerHTML=`<div style="color:#ff6666;font-size:10px;padding:8px;">Erreur — réessaie</div>`;}
}

function saveP(){
  if(!selB) return;
  prospects=[{id:Date.now(),addr:baddr(selB),meta:bmeta(selB),score:selB._score,jlr:selB._jlr||{},analysis:selB._analysis||null,lettre:selB._lettre||'',date:new Date().toLocaleDateString('fr-CA')},...prospects];
  document.getElementById('pcnt').textContent=`(${prospects.length})`;
  const b=document.querySelector('.sbtn'); if(b){b.textContent='✓ Sauvegardé!';b.style.color='#00ff87';}
}

function renderProspects(){
  const el=document.getElementById('prospects');
  if(!prospects.length){el.innerHTML=`<div class="empty-state" style="padding:80px 0;"><div class="empty-icon">📋</div><div class="empty-t" style="font-size:14px;color:#3a3a3a;">Aucun prospect</div><div class="empty-s" style="font-size:11px;color:#2a2a2a;">Scanne et sauvegarde les meilleurs deals</div></div>`;return;}
  el.innerHTML=prospects.map((p,i)=>`<div class="pc"><div class="pc-h"><div><div class="pc-a">${p.addr}</div><div class="pc-m">${p.meta} · ${p.date}</div></div><div style="display:flex;align-items:center;gap:10px;"><span style="font-size:12px;font-weight:700;color:${scol(p.score)}">${p.score}%</span><button class="delbtn" onclick="delP(${i})">🗑</button></div></div>${p.jlr?.price?`<div style="font-size:10px;color:#555;margin-bottom:8px;">Prix: ${parseInt(p.jlr.price).toLocaleString('fr-CA')}$ · ${p.jlr.doors||'?'} portes · ${p.jlr.owner||'Proprio inconnu'}</div>`:''} ${p.analysis?`<div style="font-size:10px;color:#666;line-height:1.7;margin-bottom:8px;">${p.analysis.synthese}</div>`:''} ${p.lettre?`<details><summary>✉ Voir la lettre</summary><div class="lettre" style="margin-top:8px;font-size:10px;" id="lp${i}">${p.lettre}</div><button class="cbtn" style="margin-top:6px;" onclick="navigator.clipboard.writeText(document.getElementById('lp${i}').textContent)">Copier</button></details>`:''}</div>`).join('');
}

function delP(i){prospects.splice(i,1);document.getElementById('pcnt').textContent=prospects.length?`(${prospects.length})`:'';renderProspects();}

function goTab(t){
  document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('on',['scanner','prospects'][i]===t));
  document.getElementById('scanner').style.display=t==='scanner'?'flex':'none';
  document.getElementById('prospects').style.display=t==='prospects'?'block':'none';
  if(t==='prospects') renderProspects();
}

window.onload=()=>initMap(45.3986,-72.7311);
</script>
</body>
